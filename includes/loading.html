<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes loading {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        .loading-bar {
            animation: loading 1.5s linear infinite;
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center min-h-screen bg-gray-100 space-y-4">
    <!-- Text thông báo -->
    <p class="text-cyan-700 font-semibold animate-pulse">Đang xử lý đặt phòng...</p>

    <!-- Thanh loading -->
    <div class="w-1/3 h-2 bg-gray-300 rounded overflow-hidden">
        <div class="h-full w-1/3 bg-cyan-600 loading-bar"></div>
    </div>



    <script>
        // Sau 3 giây sẽ chuyển sang completed.html
        setTimeout(() => {
            window.location.href = "../includes/completed.php";
        }, 3000);
    </script>
</body>

</html>
